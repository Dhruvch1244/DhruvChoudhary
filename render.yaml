services:
  - type: web
    name: dhruvchoudhary-spotify
    runtime: node
    rootDir: server
    plan: free
    branch: claude/dhruvchoudhary-portfolio-site-8i7wt1
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
      - key: SPOTIFY_USER_ID
        sync: false
