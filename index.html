    <title>Dhruv Choudhary — Software Engineer</title>
    <script>
      // Set the theme before first paint so there's no flash of the wrong
      // theme while React boots. Falls back to system preference.
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();

      // GitHub Pages SPA routing fallback: restore the real path that 404.html stashed.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
