<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Dhruv Choudhary — Software Engineer building enterprise backend systems, real-time apps, and ML-driven platforms." />
    <meta property="og:title" content="Dhruv Choudhary — Software Engineer" />
    <meta property="og:description" content="Enterprise backend systems, real-time apps, and ML-driven platforms." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07080c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Dhruv Choudhary — Software Engineer</title>
    <script>
      // Set the theme before first paint so there's no flash of the wrong
      // theme while React boots. Falls back to system preference.
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);

        // Same for the world (see src/data/worlds.ts): ?world= link > last pick.
        // Keep this font map in sync with WORLDS[].fonts.
        var fonts = {
          terminal: 'family=JetBrains+Mono:wght@400;500;700;800',
          arcade: 'family=Press+Start+2P&family=VT323',
          iron: 'family=Archivo+Black&family=Archivo:wght@400;500;600;700',
          pitlane: 'family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Barlow:wght@400;500;600',
          nightshift: 'family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700'
        };
        var world = new URLSearchParams(location.search).get('world');
        try { if (!(world in fonts)) world = localStorage.getItem('world'); } catch (e) {}
        if (world in fonts) {
          document.documentElement.setAttribute('data-world', world);
          var link = document.createElement('link');
          link.id = 'world-fonts-' + world;
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?' + fonts[world] + '&display=swap';
          document.head.appendChild(link);
        }
      })();

      // GitHub Pages SPA routing fallback: restore the real path that 404.html stashed.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
